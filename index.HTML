<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستەمێ  جورێن خامێن </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        .form-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #e9ecef;
        }
        .form-section h3 {
            margin-top: 0;
            font-size: 16px;
            color: #495057;
            margin-bottom: 12px;
            border-bottom: 2px solid #dee2e6;
            padding-bottom: 5px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }
        .info-text {
            font-size: 13px;
            color: #007bff;
            margin-top: 4px;
            font-weight: bold;
        }
        .btn-advance {
            background-color: #d9534f;
            color: white;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }
        .btn-advance:hover {
            background-color: #c9302c;
        }
        .summary-box {
            display: flex;
            justify-content: space-around;
            margin-top: 25px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 8px;
            text-align: center;
        }
        .summary-item h4 {
            margin: 0 0 5px 0;
            color: #555;
            font-size: 14px;
        }
        .summary-item p {
            margin: 0;
            font-size: 18px;
            font-weight: bold;
            color: #d9534f;
        }
        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            font-size: 14px;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        .badge-advance {
            color: #d9534f;
            font-weight: bold;
        }
        .btn-action-group {
            display: flex;
            gap: 5px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-edit {
            background-color: #f0ad4e;
            color: white;
            padding: 5px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        .btn-edit:hover {
            background-color: #ec971f;
        }
        .btn-deduct-row {
            background-color: #5cb85c;
            color: white;
            padding: 5px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        .btn-deduct-row:hover {
            background-color: #4cae4c;
        }
        .btn-delete {
            background-color: #dc3545;
            color: white;
            padding: 5px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        .btn-delete:hover {
            background-color: #c82333;
        }
        .inline-deduct-box {
            background: #f1f8e9;
            padding: 10px;
            border: 1px dashed #7cb342;
            margin-top: 5px;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>رێڤەبرنا جورێن خامێ</h2>
    
    <input type="hidden" id="editId" value="">

    <!-- بەشێ تۆمارکرنا خامێ -->
    <div class="form-section">
        <h3>تۆمارکرنا خامێ (+)</h3>
        <div class="form-group">
            <label for="workerName">ناڤێ خامێ:</label>
            <input type="text" id="workerName" placeholder="ناڤی لڤێرێ بنڤیسە..." oninput="onWorkerNameInput(this.value)">
            <div id="workerInfo" class="info-text"></div>
        </div>
        <div class="form-group">
            <label for="kilos">کیلۆ (کێش):</label>
            <input type="number" id="kilos" placeholder="چەند کیلو نە..." step="any">
        </div>
        <div class="form-group">
            <label for="amount">کوژمێ خام (پارە):</label>
            <input type="number" id="amount" placeholder="بهای بنڤیسە...">
        </div>
        <button class="btn-advance" id="submitBtn" onclick="addTransaction()">تۆمارکرنا خام</button>
    </div>

    <!-- کورتەیا حیسابان -->
    <div class="summary-box">
        <div class="summary-item">
            <h4>کۆی گشتیێ کیلۆیان</h4>
            <p id="totalKilos" style="color: #007bff;">0 ک</p>
        </div>
        <div class="summary-item">
            <h4>کۆی گشتیێ خامێ</h4>
            <p id="totalAdvance">0</p>
        </div>
    </div>

    <!-- تابلۆیا تۆماران -->
    <h3>تۆمارێن دووماهیێ</h3>
    <table>
        <thead>
            <tr>
                <th>ناڤ</th>
                <th>کیلۆ</th>
                <th>کوژمە</th>
                <th>جۆر</th>
                <th>چالاكی</th>
            </tr>
        </thead>
        <tbody id="transactionTable">
            <!-- لێرە تۆمار دێ هێنە زێدەکرن -->
        </tbody>
    </table>
</div>

<script>
    let transactions = [];

    function getWorkerTotal(workerName) {
        if (!workerName) return 0;
        let cleanName = workerName.trim().toLowerCase();
        let total = 0;
        
        transactions.forEach(t => {
            if (t.name.trim().toLowerCase() === cleanName) {
                total += t.amount;
            }
        });
        return total;
    }

    function onWorkerNameInput(val) {
        let total = getWorkerTotal(val);
        document.getElementById('workerInfo').innerText = val.trim() ? `کۆی گشتیێ خام ل دەف ڤی کارمەندی: ${total}` : "";
    }

    function addTransaction() {
        let name = document.getElementById('workerName').value.trim();
        let kilos = parseFloat(document.getElementById('kilos').value) || 0;
        let amount = parseFloat(document.getElementById('amount').value);
        let editId = document.getElementById('editId').value;

        if (!name || isNaN(amount) || amount <= 0) {
            alert("بخوازە ناڤەکی دروست و کوژمەکێ دروست بنڤیسە!");
            return;
        }

        if (editId) {
            let item = transactions.find(t => t.id == editId);
            if (item) {
                item.name = name;
                item.kilos = kilos;
                item.amount = amount;
            }
            document.getElementById('editId').value = '';
            document.getElementById('submitBtn').innerText = "تۆمارکرنا خام";
        } else {
            const transaction = {
                id: Date.now(),
                name: name,
                kilos: kilos,
                amount: amount
            };
            transactions.push(transaction);
        }

        updateUI();
        clearForm();
    }

    function editTransaction(id) {
        let t = transactions.find(item => item.id == id);
        if (!t) return;

        document.getElementById('editId').value = t.id;
        document.getElementById('workerName').value = t.name;
        document.getElementById('kilos').value = t.kilos;
        document.getElementById('amount').value = t.amount;
        document.getElementById('submitBtn').innerText = "نووکرنا تۆمارێ (گۆڕین)";

        onWorkerNameInput(t.name);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleDeductBox(id) {
        let box = document.getElementById(`deductBox_${id}`);
        if (box) {
            box.style.display = box.style.display === 'none' ? 'block' : 'none';
        }
    }

    function applyDeduct(id) {
        let inputField = document.getElementById(`deductInput_${id}`);
        let deductAmount = parseFloat(inputField.value);

        if (isNaN(deductAmount) || deductAmount <= 0) {
            alert("بخوازە کوژمەکێ دروست بۆ دەرخستنێ بنڤیسە!");
            return;
        }

        let t = transactions.find(item => item.id == id);
        if (!t) return;

        if (deductAmount > t.amount) {
            alert("⚠️ ئاگاداری: کوژمێ دەرخستنێ پترە ژ کوژمێ ڤی ڕیزی!");
            return;
        }

        t.amount -= deductAmount;
        updateUI();
    }

    function deleteTransaction(id) {
        if (document.getElementById('editId').value == id) {
            document.getElementById('editId').value = '';
            document.getElementById('submitBtn').innerText = "تۆمارکرنا خام";
            clearForm();
        }
        transactions = transactions.filter(t => t.id !== id);
        updateUI();
    }

    function updateUI() {
        const tableBody = document.getElementById('transactionTable');
        tableBody.innerHTML = '';
        
        let totalAdv = 0;
        let totalKilos = 0;

        transactions.forEach(t => {
            totalAdv += t.amount;
            totalKilos += t.kilos;

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${t.name}</td>
                <td>${t.kilos} ک</td>
                <td>
                    ${t.amount}
                    <div id="deductBox_${t.id}" class="inline-deduct-box">
                        <input type="number" id="deductInput_${t.id}" placeholder="کوژمێ دەرخستنێ..." style="margin-bottom: 5px; padding: 5px; font-size: 13px;">
                        <button class="btn-deduct-row" onclick="applyDeduct(${t.id})" style="width: 100%;">پەسەندکرن (-)</button>
                    </div>
                </td>
                <td>
                    <span class="badge-advance">خام (+)</span>
                </td>
                <td>
                    <div class="btn-action-group">
                        <button class="btn-edit" onclick="editTransaction(${t.id})">دەستکاری</button>
                        <button class="btn-deduct-row" onclick="toggleDeductBox(${t.id})">ئینانا خوارێ</button>
                        <button class="btn-delete" onclick="deleteTransaction(${t.id})">ژێبرن</button>
                    </div>
                </td>
            `;
            tableBody.appendChild(row);
        });

        document.getElementById('totalAdvance').innerText = totalAdv;
        document.getElementById('totalKilos').innerText = totalKilos + " ک";

        let currentName = document.getElementById('workerName').value;
        if (currentName) onWorkerNameInput(currentName);
    }

    function clearForm() {
        document.getElementById('workerName').value = '';
        document.getElementById('kilos').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('workerInfo').innerText = '';
        document.getElementById('editId').value = '';
        document.getElementById('submitBtn').innerText = "تۆمارکرنا خام";
    }
</script>

</body>
</html>
